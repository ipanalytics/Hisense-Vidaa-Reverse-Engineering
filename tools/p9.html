<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tv context probe</title>
<style>
 body{font:16px/1.3 sans-serif;background:#111;color:#eee;margin:0;padding:16px}
 h1{font-size:18px;margin:0 0 8px}
 #log{white-space:pre-wrap;font-family:monospace;font-size:12px}
 .ok{color:#6f6}.bad{color:#f66}.dim{color:#888}.hit{color:#ff0}
</style>
</head>
<body>
<h1>настоящий vowOSContext <small class="dim">read-only</small></h1>
<div id="log"></div>
<script>
/* Ошибка предыдущих страниц: мы затирали vowOSContext, не посмотрев,
   что в нём лежит. Телевизор даёт его сам. Снимаем оригинал целиком. */
var API = "", out = { ctx: {}, nav: {}, sources: {}, pkgmgr: [], exec: [] };

function log(m, c) {
  var el = document.getElementById("log"), d = document.createElement("div");
  if (c) d.className = c; d.textContent = String(m).slice(0, 400); el.appendChild(d);
}
function post(p, o, cb) {
  try { var x = new XMLHttpRequest(); x.open("POST", API + p, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function () { if (x.readyState === 4 && cb) cb(x.status); };
    x.send(JSON.stringify(o)); } catch (e) { if (cb) cb(0); }
}
function js(v) { try { return JSON.stringify(v).slice(0, 400); } catch (e) { return String(v).slice(0, 200); } }

/* ---------- 1. оригинальный контекст ---------- */
var orig = window.vowOSContext, origGetter = null;
out.ctx.type = typeof orig;
out.ctx.keys = (function () { try { var a = []; for (var k in orig) { a.push(k + ":" + typeof orig[k]); if (a.length > 30) break; } return a; } catch (e) { return "err:" + e; } })();
out.ctx.proto = (function () { try { return Object.getPrototypeOf(orig) ? Object.getOwnPropertyNames(Object.getPrototypeOf(orig)).slice(0, 20) : null; } catch (e) { return "err"; } })();
out.ctx.ownProps = (function () { try { return Object.getOwnPropertyNames(orig).slice(0, 30); } catch (e) { return "err"; } })();
try { if (orig && typeof orig.getAppIdentifier === "function") { origGetter = orig.getAppIdentifier; out.ctx.callResult = String(orig.getAppIdentifier()); } } catch (e) { out.ctx.callError = String(e && e.message || e); }
log("vowOSContext.callResult = " + (out.ctx.callResult || out.ctx.callError || "—"), out.ctx.callResult ? "hit" : "dim");

/* ---------- 2. навигатор ---------- */
try {
  var d1 = Object.getOwnPropertyDescriptor(navigator, "appIdentifier");
  var d2 = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(navigator), "appIdentifier");
  out.nav.instance = d1 ? { value: String(d1.value), type: typeof d1.value, get: !!d1.get } : null;
  out.nav.proto = d2 ? { type: typeof d2.value, get: !!d2.get } : null;
  out.nav.value = String(navigator.appIdentifier);
} catch (e) { out.nav.error = String(e); }
log("navigator.appIdentifier: инстанс=" + js(out.nav.instance) + " прототип=" + js(out.nav.proto), "dim");

/* ---------- 3. полные исходники протокола ---------- */
var S = window.vowOS.service;
["execute", "executeHttpRequest", "socketonmessage", "socketonerror", "socketonclose"].forEach(function (n) {
  try { out.sources[n] = Function.prototype.toString.call(S[n]).slice(0, 4000); } catch (e) { out.sources[n] = "err:" + e; }
});
out.serviceProps = (function () { var a = []; try { for (var k in S) { var v = S[k]; if (typeof v !== "function") a.push(k + "=" + js(v)); } } catch (e) {} return a; })();

/* ---------- 4. pkgmgr: метаданные приложений ---------- */
var PKG_APIS = ["getInstalledPkgs", "getAppInfo", "getAppConfig", "getAppList", "getPkgInfo",
                "getPermissions", "getStartupApps", "getRunningApps", "getAppDetail", "getStoreInfo"];
var i = 0;
(function nextPkg() {
  if (i >= PKG_APIS.length) return regStage();
  var api = PKG_APIS[i++];
  var r = null;
  try { r = window.vowOS.service.syncExecute("pkgmgr", { api: api, args: "" }); } catch (e) { r = { thrown: String(e) }; }
  var s = js(r), supported = s.indexOf("Not supported api") < 0;
  out.pkgmgr.push({ api: api, result: s });
  log((supported ? "HIT  " : "     ") + "pkgmgr/" + api + " -> " + s.slice(0, 180), supported ? "hit" : "dim");
  setTimeout(nextPkg, 60);
})();

/* ---------- 5. попытка register через websocket-канал ---------- */
function regStage() {
  var id = out.ctx.callResult || "";
  var forms = [
    ["register/{}", { method: "register", parameters: {} }],
    ["register/{identifier}", { method: "register", parameters: { identifier: id } }],
    ["register/{appIdentifier}", { method: "register", parameters: { appIdentifier: id } }],
    ["callAPI/getOSVersion", { method: "callAPI", parameters: { api: "getOSVersion" } }]
  ];
  var j = 0;
  (function nextExec() {
    if (j >= forms.length) return finish();
    var f = forms[j++];
    try {
      var r = window.vowOS.service.execute("phoenix://service/tvinfo", f[1]);
      out.exec.push({ form: f[0], result: String(js(r)) });
      log("execute " + f[0] + " -> " + js(r).slice(0, 160), "dim");
    } catch (e) {
      out.exec.push({ form: f[0], error: String(e && e.message || e) });
      log("execute " + f[0] + " -> err " + e.message, "bad");
    }
    setTimeout(nextExec, 400);
  })();
}

function finish() {
  out.userAgent = navigator.userAgent;
  post("/probe", Object.assign({ name: "context" }, out), function (st) {
    log(st === 200 ? "готово: отправлено" : "ошибка отправки " + st, st === 200 ? "ok" : "bad");
  });
}
</script>
</body>
</html>
